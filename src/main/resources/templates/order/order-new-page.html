<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>order-new-page</title>
</head>
<body>
<p>ORDER NEW PAGE</p>
<form th:method="POST" th:action="@{/order}" th:object="${orderNew}">
    <label for="deliveryAddressId">Address</label>
    <input type="text" th:field="*{deliveryAddress}" id="deliveryAddressId">
    <div style="color: red" th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></div>
    <br>
    <label for="commentId">Comment</label>
    <input type="text" th:field="*{comment}" id="commentId">
    <div style="color: red" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
    <br>
    <label for="nameId">Name</label>
    <input type="text" th:field="*{name}" id="nameId">
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br>
    <label for="lastnameId">Lastname</label>
    <input type="text" th:field="*{lastname}" id="lastnameId">
    <div style="color: red" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"></div>
    <br>
    <label for="phoneId">Phone</label>
    <input type="text" th:field="*{phone}" id="phoneId">
    <div style="color: red" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    <br>
    <input type="submit" value="Підтверджую замовлення">
</form>


</body>
</html>
