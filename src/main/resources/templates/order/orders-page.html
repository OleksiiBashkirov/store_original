<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orders-page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .order-list {
            list-style: none;
            padding: 0;
        }

        .order-list li {
            background-color: #f9f9f9;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .order-list li:hover {
            background-color: #e6e6e6;
            transform: scale(1.02);
        }

        .order-info {
            flex-grow: 1;
            margin-right: 10px;
        }

        .order-info p {
            margin: 5px 0;
            font-size: 16px;
        }

        .order-info p span {
            font-weight: bold;
        }


        .order-list a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            font-size: 18px;
        }

        .order-list a:hover {
            text-decoration: underline;
        }

        .icon {
            color: #333;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>All Orders(Admin View)</h1>
    <ul class="order-list" th:if="${admin}" th:each="order : ${ordersAll}">
        <li>
            <div class="order-info">
                <a th:href="@{/order/admin/{id}(id=${order.getId()})}"
                   th:text="${order.getId() + '. Person Id= ' + order.getPersonId() + ', status= ' + order.getOrdersStatus().toString()
        + ', created at= ' + order.getCreatedAt().toString() + ', delivery address= ' + order.getDeliveryAddress() +
        ', comment= ' + order.getComment() + ', name= ' + order.getName() + ', lastname= ' + order.getLastname() + ', phone= '
        + order.getPhone()}">
                    <i class="fas fa-arrow-right icon"></i>
                </a>
            </div>
        </li>
    </ul>
</div>

<!--    </div>-->
<!--</div>-->

</body>
</html>
