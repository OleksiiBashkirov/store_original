<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>all</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .btn-container {
            text-align: left;
            margin-bottom: 20px;
        }

        .btn-return {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-return:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .btn-return:active {
            transform: scale(0.98);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            cursor: pointer;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #cce7ff;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background-color: #e6f2ff;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #d0e9ff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="btn-container">
        <form th:method="GET" th:action="@{/product}">
            <button type="submit" class="btn-return">Всі продукти</button>
        </form>
    </div>

    <h1>Замовлення користувача</h1>

    <table>
        <thead>
        <tr>
            <td>ID</td>
            <td>Дата створення</td>
            <td>Статус</td>
            <!--            <td>Загальна сума</td>-->
        </tr>
        </thead>
        <tbody>
        <tr th:each="orderCartItemDto : ${ordersHistoryByUser}"
            th:onclick="|window.location='/order/'+${orderCartItemDto.getOrder().getId()}|">
            <td th:text="${orderCartItemDto.getOrder().getId()}"></td>
            <td th:text="${orderCartItemDto.getOrder().getCreatedAt()}"></td>
            <td th:text="${orderCartItemDto.getOrder().getOrdersStatus().toString()}"></td>
            <!--        <td th:text="${orderCartItemDto.getOrder().getTotalAmount() + ' $'}"></td>-->
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
